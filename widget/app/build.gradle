plugins {
    id 'com.android.application'
}

android {
    namespace 'de.bergf3x.bgawidget'
    compileSdk 34

    defaultConfig {
        applicationId 'de.bergf3x.bgawidget'
        minSdk 26
        targetSdk 34
        // CI: VERSION_CODE = Lauf-Nr., VERSION_NAME = 1.NN, BUILD_DATE = Datum; lokal Platzhalter
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('VERSION_NAME') ?: '1.00'
        resValue 'string', 'build_date', System.getenv('BUILD_DATE') ?: 'lokal'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
