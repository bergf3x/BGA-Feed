plugins {
    id 'com.android.application'
}

android {
    namespace 'de.bergf3x.bgawidget'
    compileSdk 34

    defaultConfig {
        applicationId 'de.bergf3x.bgawidget' + (System.getenv('DIRECT') == 'true' ? '.test' : '')
        minSdk 26
        targetSdk 34
        // CI: VERSION_CODE = Lauf-Nr., VERSION_NAME = 1.NN, BUILD_DATE = Datum; lokal Platzhalter
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName = System.getenv('VERSION_NAME') ?: '1.00'
        resValue('bool', 'direct_fetch', 'true') // Abruf direkt vom Handy (GitHub-Feed als Ersatz)
        manifestPlaceholders = [appLabel: (System.getenv('DIRECT') == 'true' ? 'BGL Test' : '@string/app_name')]
        resValue('string', 'build_date', System.getenv('BUILD_DATE') ?: 'lokal')
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // Auslieferung: nicht debuggable (ART optimiert voll), gleiche Signatur wie bisher, damit Updates ohne Deinstallation gehen.
        // Keine Code-Verkleinerung (R8): die App nutzt Reflection und ist so einfacher zu pruefen.
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
