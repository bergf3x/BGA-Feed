name: apptest
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Emulator-Test mitlaufen lassen"
        default: "true"
      script:
        description: "Testskript"
        default: "apptest.sh"
permissions:
  contents: write
jobs:
  quellen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - name: Quellen pruefen
        run: python tools/source_check.py | tee quellen.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quellen
          path: quellen.txt
  app:
    if: inputs.app != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: direct-test
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        working-directory: src/widget
        env:
          DIRECT: "true"
          VERSION_CODE: "999"
          VERSION_NAME: apptest
        run: gradle --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../../app.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator-Alltagstest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/${{ inputs.script || 'apptest.sh' }}
      - name: Ergebnisse in Zweig apptest-results ablegen
        if: always()
        run: |
          cd out
          git init -q -b apptest-results
          git config user.name "apptest"; git config user.email "apptest@users.noreply.github.com"
          git add -A && git commit -qm "Alltagstest ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apptest-results
