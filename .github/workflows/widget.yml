name: widget
on:
  push:
    paths:
      - "widget/**"
      - ".github/workflows/widget.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version festlegen
        run: |
          # 1.00 = erste vollstaendige Version; jede weitere Aenderung an der App zaehlt eins hoch
          BASE=9a3642057358111be2eef6de39d770e3d3f6357e
          N=$(( $(git rev-list --count $BASE..HEAD -- widget .github/workflows/widget.yml) - 1 ))
          [ $N -lt 0 ] && N=0
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$(printf '%02d' $N)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(TZ=Europe/Berlin date '+%d.%m.%Y, %H:%M Uhr')" >> "$GITHUB_ENV"
      - name: APK bauen
        working-directory: widget
        run: gradle --no-daemon assembleRelease
      - name: APK als Release bereitstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="BGL-Wetter-News-v${VERSION_NAME}.apk"
          cp widget/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release delete widget-latest --yes --cleanup-tag || true
          gh release create widget-latest "$APK" \
            --title "BGL Wetter & News ${VERSION_NAME}" \
            --notes "Version ${VERSION_NAME}, gebaut am ${BUILD_DATE}. ${APK} herunterladen und installieren." \
            --target "${{ github.sha }}"
