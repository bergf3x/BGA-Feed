name: widget
on:
  push:
    paths:
      - "widget/**"
      - ".github/workflows/widget.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        working-directory: widget
        run: gradle --no-daemon assembleDebug
      - name: APK als Release bereitstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp widget/app/build/outputs/apk/debug/app-debug.apk BGL-Wetter-News.apk
          gh release delete widget-latest --yes --cleanup-tag || true
          gh release create widget-latest BGL-Wetter-News.apk \
            --title "BGL Wetter & News (aktuell)" \
            --notes "Automatisch gebaut. BGL-Wetter-News.apk herunterladen und installieren." \
            --target "${{ github.sha }}"
